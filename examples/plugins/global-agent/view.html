<div class="plugin-page"><main><p id="qa" class="hint"></p>
<section class="card setup"><div><label for="backend">Configured Agent backend</label><select id="backend" disabled></select></div>
<div><label for="conversation">Owned conversation</label><select id="conversation"><option value="">New conversation</option></select></div>
<div class="actions"><button id="refresh" type="button">Refresh backends</button><button id="targets" type="button">Choose terminals</button><button id="open" type="button" disabled>Open conversation</button></div><p id="selection" class="hint">No targets selected yet.</p></section>
<section class="card response"><pre id="transcript" aria-live="polite"></pre><p id="usage" class="hint"></p><p id="activity" class="hint"></p></section>
<form id="compose"><label for="prompt">Message</label><textarea id="prompt" maxlength="16384" placeholder="Ask about the selected terminals"></textarea><div class="actions"><button id="send" type="submit" disabled>Send</button><button id="stop" type="button" disabled>Stop</button><span id="status" role="status">Loading configured backends…</span></div></form>
<footer>Actions follow this plugin's Allow / Ask / Deny setting.</footer></main></div>
