name: test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify generated Catty tool specs
        run: |
          npm run generate:capability-tools
          git diff --exit-code infrastructure/ai/harness/generated/cattyToolSpecs.json infrastructure/ai/harness/generated/globalAgentToolSpecs.json

      - name: Verify Codex App Server schema
        run: npm run check:codex-app-server-schema

      - name: Verify plugin contract and runtime boundaries
        run: |
          npm run check:plugin-contract
          npm run test:plugin-runtime
          npm run test:plugin-examples

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
